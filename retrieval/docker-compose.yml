# ============================================================
# retrieval 真环境基础设施（RETRIEVAL_BACKEND=real 时用）
# 用途：本地/CI 起一套与生产同构的三库，验证 real 通道
# 启动：docker compose up -d    停止：docker compose down -v
#
# 纪律：
#   - 本 compose 只用于【开发/验证】，不得直接暴露到公网（默认口令均为 dev 值）
#   - retrieval 侧一律用只读账号 retrieval_ro（IF-9），写操作全拒为验收条件
#   - 生产三库由运维提供，此处不做生产编排
# ============================================================
version: "3.8"

services:
  # ---------- PostgreSQL：父块事实源（离线写入期事实源，在线只做 QRY-06 回捞）----------
  postgres:
    image: postgres:16-alpine
    container_name: retrieval-pg
    environment:
      POSTGRES_USER: qingxi
      POSTGRES_PASSWORD: dev_only
      POSTGRES_DB: qingxi
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro   # 001_init.sql 首次启动自动执行
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qingxi -d qingxi"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- Milvus standalone（依赖 etcd + minio）----------
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: retrieval-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: retrieval-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: retrieval-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20

  # ---------- Neo4j：图谱（③-A 遍历 + 图谱页）----------
  neo4j:
    image: neo4j:5.20-community
    container_name: retrieval-neo4j
    environment:
      NEO4J_AUTH: neo4j/dev_only
      NEO4J_PLUGINS: '[]'          # 明确不装 GDS（V1.1 §0.1：社区检测走 igraph，不装插件）
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - ./neo4j:/import:ro          # 001_constraints.cypher 可用 cypher-shell 导入
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p dev_only 'RETURN 1' | grep -q 1"]
      interval: 15s
      timeout: 10s
      retries: 20

volumes:
  pgdata:
  etcd-data:
  minio-data:
  milvus-data:
  neo4j-data:
